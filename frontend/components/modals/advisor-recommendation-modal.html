<div class="modal fade advisor-recommendation-modal" id="{{idPrefix}}Modal" tabindex="-1" aria-labelledby="{{idPrefix}}ModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable advisor-recommendation-dialog">
    <div class="modal-content app-modal-surface">
      <div class="modal-header">
        <h5 class="modal-title" id="{{idPrefix}}ModalLabel">{{title}}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form class="modal-body" id="{{idPrefix}}Form" novalidate>
        <div class="mb-3">
          <label for="{{idPrefix}}Client" class="form-label">Cliente</label>
          <select id="{{idPrefix}}Client" name="clientId" class="form-select" required></select>
        </div>
        <div class="mb-3">
          <label for="{{idPrefix}}Title" class="form-label">Titulo</label>
          <input id="{{idPrefix}}Title" name="title" class="form-control" maxlength="120" required />
        </div>
        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label for="{{idPrefix}}Type" class="form-label">Tipo</label>
            <select id="{{idPrefix}}Type" name="type" class="form-select" required>
              <option value="">Seleccionar tipo</option>
              {{typeOptions}}
            </select>
          </div>
          <div class="col-sm-6">
            <label for="{{idPrefix}}Priority" class="form-label">Prioridad</label>
            <select id="{{idPrefix}}Priority" name="priority" class="form-select" required>
              {{priorityOptions}}
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label for="{{idPrefix}}Message" class="form-label">Mensaje</label>
          <textarea id="{{idPrefix}}Message" name="message" class="form-control" rows="3" required></textarea>
        </div>
        <button class="action-btn action-btn--primary" type="submit">{{submitText}}</button>
      </form>
    </div>
  </div>
</div>
