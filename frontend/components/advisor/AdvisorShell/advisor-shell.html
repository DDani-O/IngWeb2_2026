<aside id="advisorSidebarOffcanvas" class="offcanvas offcanvas-start app-offcanvas" tabindex="-1" aria-labelledby="advisorSidebarOffcanvasLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="advisorSidebarOffcanvasLabel">Menu de Navegacion</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column gap-2">
    <div class="sidebar-user-card">
      <span class="sidebar-user-card__avatar" id="advisorSidebarInitials">{{advisorInitials}}</span>
      <div>
        <p class="sidebar-user-card__name" id="advisorSidebarName">{{advisorName}}</p>
        <p class="sidebar-user-card__meta">Asesor Financiero</p>
      </div>
    </div>

    <p class="sidebar-section-title mt-2">NAVEGACION</p>
    {{navigationLinks}}

    <p class="sidebar-section-title mt-2">ACCIONES</p>
    {{actionLinks}}

    <div class="sidebar-spacer"></div>
    <button class="sidebar-link sidebar-logout" id="advisorLogoutButtonMobile" type="button">
      <i class="fa-solid fa-right-from-bracket"></i> Salir
    </button>
  </div>
</aside>
