<div class="app-page-content page-cliente-editar-gasto">

    <h1 class="text-gradient">Editar Gasto</h1>

      Corregi los datos del gasto o cambia su categoria. Los cambios se reflejan en tus patrones y en el analisis de tu asesor.
    </p>
  </section>

  <div class="two-column">
    <section class="section-block">
      <h2 class="section-title"><i class="fa-solid fa-pen-to-square accent" aria-hidden="true"></i>Datos del gasto</h2>
      <div id="editExpenseForm"></div>
    </section>

    <section class="section-block">
      <h2 class="section-title"><i class="fa-solid fa-circle-info accent" aria-hidden="true"></i>Informacion del registro</h2>
      <div id="editExpenseInfo" aria-live="polite"></div>
      <div class="section-actions">
        <button class="action-btn action-btn--danger" data-action="delete" type="button">
          <i class="fa-solid fa-trash" aria-hidden="true"></i><span>Eliminar gasto</span>
        </button>
      </div>
    </section>
  </div>
</div>
