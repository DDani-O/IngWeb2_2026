<div class="app-page-content page-user-recomendaciones">
  <section class="section-block recommendations-hero">
    <h1 class="text-gradient">Recomendaciones Financieras</h1>
    <p class="text-muted mt-2">
      Sugerencias, alertas y observaciones generadas por el sistema o por tu asesor a partir de tus gastos.
    </p>
  </section>

  <section class="section-block">
    <div class="recommendation-toolbar">
      <label class="text-muted" for="recommendationPriorityFilter">Prioridad</label>
      <select id="recommendationPriorityFilter" class="form-select form-select-sm">
        <option value="todas">Todas</option>
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>

      <label class="text-muted" for="recommendationTypeFilter">Tipo</label>
      <select id="recommendationTypeFilter" class="form-select form-select-sm">
        <option value="todos">Todos</option>
        <option value="sugerencia">Sugerencia</option>
        <option value="alerta">Alerta</option>
        <option value="observacion">Observacion</option>
      </select>

      <label class="text-muted" for="recommendationReadFilter">Estado</label>
      <select id="recommendationReadFilter" class="form-select form-select-sm">
        <option value="todas">Todas</option>
        <option value="sin-leer">Sin leer</option>
        <option value="leidas">Leidas</option>
      </select>

      <label class="text-muted" for="recommendationSortFilter">Ordenar</label>
      <select id="recommendationSortFilter" class="form-select form-select-sm">
        <option value="reciente">Mas Reciente</option>
        <option value="prioridad">Por Prioridad</option>
      </select>

      <span class="ms-auto text-muted" id="recommendationCount">0 recomendaciones</span>
    </div>
  </section>

  <div id="recommendationGroups" class="d-flex flex-column gap-3">
    <section class="section-block recommendations-group recommendations-group--high">
      <h2 class="section-title recommendations-group__title">
        <i class="fa-solid fa-circle-exclamation accent"></i>
        Prioridad Alta
      </h2>
      <div class="recommendation-group" id="recommendationsHighPriority"></div>
    </section>

    <section class="section-block recommendations-group recommendations-group--medium">
      <h2 class="section-title recommendations-group__title">
        <i class="fa-solid fa-circle-info accent"></i>
        Prioridad Media y Baja
      </h2>
      <div class="recommendation-group" id="recommendationsOtherPriority"></div>
    </section>

    <section class="section-block recommendations-group recommendations-group--completed">
      <h2 class="section-title recommendations-group__title">
        <i class="fa-solid fa-circle-check accent"></i>
        Leidas
      </h2>
      <div class="recommendation-group" id="recommendationsRead"></div>
    </section>
  </div>

  <div class="d-flex flex-wrap gap-2">
    <button class="action-btn action-btn--primary js-dashboard-back" type="button">
      <i class="fa-solid fa-arrow-left"></i>
      Volver al Dashboard
    </button>
  </div>

  <div class="modal fade" id="recommendationDetailModal" tabindex="-1" aria-labelledby="recommendationDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content app-modal-surface">
        <div class="modal-header">
          <h5 class="modal-title" id="recommendationDetailModalLabel">Detalle de Recomendacion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="recommendationDetailContent"></div>
      </div>
    </div>
  </div>
</div>
