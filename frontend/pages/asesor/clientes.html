<div class="app-page-content page-asesor-clientes">
  <section class="hero-panel">
    <h1 class="text-gradient">Gestion de Clientes</h1>
    <p class="text-muted mt-2">
      Administra tu cartera, revisa el riesgo de cada cliente y envia recomendaciones.
    </p>
    <div class="dashboard-hero__actions">
      <button class="action-btn action-btn--primary" data-action="new-recommendation" type="button">
        <i class="fa-solid fa-pen" aria-hidden="true"></i><span>Enviar recomendacion</span>
      </button>
      <a class="action-btn action-btn--ghost" href="#/asesor/dashboard">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span>Volver al panel</span>
      </a>
    </div>
  </section>

  <section class="section-block">
    <div id="clientsFilters"></div>
    <div class="section-header mt-3">
      <p class="text-muted" id="clientsCount" aria-live="polite">0 clientes</p>
      <div id="clientsView"></div>
    </div>
    <div class="client-grid" id="clientsCards"></div>
    <div class="app-hidden" id="clientsTable"></div>
  </section>

  <div id="clientRecommendationDialog"></div>
</div>
