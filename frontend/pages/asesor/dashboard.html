<div class="app-page-content page-asesor-dashboard">
  <section class="hero-panel">
    <div class="dashboard-hero">
      <div>
        <h1 class="text-gradient" id="advisorWelcome">Hola!</h1>
        <p class="text-muted mt-2">Tu panel de asesor esta listo. Gestiona tus clientes y envia recomendaciones personalizadas.</p>
        <div class="dashboard-hero__actions">
          <a class="action-btn action-btn--primary" href="#/asesor/clientes">
            <i class="fa-solid fa-users" aria-hidden="true"></i><span>Ver Mis Clientes</span>
          </a>
          <button class="action-btn action-btn--ghost" data-action="new-recommendation" type="button">
            <i class="fa-solid fa-pen" aria-hidden="true"></i><span>Enviar Recomendacion</span>
          </button>
        </div>
      </div>
      <div id="advisorDate"></div>
      <div class="alert-list" id="advisorAlerts" aria-live="polite"></div>
    </div>
  </section>

  <section class="section-block">
    <h2 class="section-title"><i class="fa-solid fa-chart-column accent" aria-hidden="true"></i>Tus Estadisticas</h2>
    <div class="stat-grid" id="advisorStats"></div>
  </section>

  <section class="section-block">
    <div class="section-header">
      <h2 class="section-title"><i class="fa-solid fa-users accent" aria-hidden="true"></i>Mis Clientes (<span id="advisorClientsCount">0</span> asignados)</h2>
      <div id="advisorClientsView"></div>
    </div>
    <div class="client-grid" id="advisorClientsCards"></div>
    <div class="app-hidden" id="advisorClientsTable"></div>
  </section>

  <section class="section-block">
    <h2 class="section-title"><i class="fa-solid fa-chart-pie accent" aria-hidden="true"></i>Analisis de la Cartera</h2>
    <div class="chart-grid chart-grid--3">
      <div id="advisorProfileChart"></div>
      <div id="advisorSpendChart"></div>
      <div class="chart-grid__wide" id="advisorActivityChart"></div>
    </div>
  </section>

  <section class="section-block">
    <h2 class="section-title"><i class="fa-solid fa-lightbulb accent" aria-hidden="true"></i>Ultimas Recomendaciones Enviadas</h2>
    <div class="card-grid" id="advisorRecommendations"></div>
  </section>

  <div id="advisorRecommendationDialog"></div>
</div>
