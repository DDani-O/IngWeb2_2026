<div class="app-page page-asesor-perfil">
  <div id="advisorTopbarSlot"></div>

  <main class="app-main app-main--wide advisor-perfil-main">
    <section class="hero-panel advisor-perfil-hero">
      <h1 class="text-gradient">Perfil del Asesor</h1>
      <p class="text-muted mt-2">
        Administra tus datos profesionales y configuracion de cartera para brindar un mejor servicio.
      </p>
    </section>

    <section class="advisor-profile-grid">
      <article class="section-block advisor-profile-summary">
        <div class="user-profile-avatar" id="advisorProfileAvatarInitials">MR</div>
        <h2 id="advisorProfileSummaryName">Cargando...</h2>
        <p class="text-muted" id="advisorProfileSummaryEmail">...</p>

        <div class="profile-meta-list mt-3" id="advisorProfileMetaList"></div>

        <div class="d-flex flex-wrap gap-2 mt-3">
          <a class="action-btn action-btn--ghost" href="#/asesor/clientes">
            <i class="fa-solid fa-users"></i>
            Gestionar clientes
          </a>
          <a class="action-btn action-btn--ghost" href="#/asesor/dashboard">
            <i class="fa-solid fa-chart-line"></i>
            Ver dashboard
          </a>
        </div>
      </article>

      <article class="section-block">
        <h2 class="section-title">
          <i class="fa-solid fa-id-card accent"></i>
          Informacion profesional y contacto
        </h2>

        <form id="advisorProfileForm" class="advisor-profile-form" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="advisorProfileFullName">Nombre completo</label>
              <input id="advisorProfileFullName" name="fullName" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="advisorProfileEmail">Email</label>
              <input id="advisorProfileEmail" name="email" type="email" class="form-control" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="advisorProfilePhone">Telefono</label>
              <input id="advisorProfilePhone" name="phone" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="advisorProfileCountry">Pais</label>
              <input id="advisorProfileCountry" name="country" class="form-control" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="advisorProfileSpecialty">Especialidad</label>
              <input id="advisorProfileSpecialty" name="specialty" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="advisorProfileLicense">Matricula</label>
              <input id="advisorProfileLicense" name="licenseNumber" class="form-control" readonly />
            </div>
            <div class="col-md-12">
              <label class="form-label" for="advisorProfileDescription">Descripcion / Biografia</label>
              <textarea id="advisorProfileDescription" name="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="advisorProfileActiveClients">Clientes actuales</label>
              <input id="advisorProfileActiveClients" type="text" class="form-control" readonly />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="advisorProfileMaxClients">Capacidad maxima</label>
              <input id="advisorProfileMaxClients" name="maxCapacity" type="number" min="1" max="100" class="form-control" required />
            </div>
            <div class="col-md-12">
              <div class="d-flex flex-column gap-2">
                <label class="form-check-label">
                  <input class="form-check-input me-2" id="advisorProfileNotifyEmail" type="checkbox" />
                  Notificaciones por email
                </label>
                <label class="form-check-label">
                  <input class="form-check-input me-2" id="advisorProfileNotifyPush" type="checkbox" />
                  Alertas en tiempo real
                </label>
              </div>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-2 mt-3">
            <button class="action-btn action-btn--primary" type="submit">
              <i class="fa-solid fa-floppy-disk"></i>
              Guardar cambios
            </button>
            <button class="action-btn action-btn--ghost" id="resetAdvisorProfileButton" type="button">
              <i class="fa-solid fa-rotate-left"></i>
              Restaurar valores
            </button>
            <button class="action-btn action-btn--ghost" id="backToAdvisorDashboardFromProfile" type="button">
              <i class="fa-solid fa-arrow-left"></i>
              Volver al Panel
            </button>
          </div>
        </form>
      </article>
    </section>

    <div id="appFooterSlot"></div>
  </main>

  <div id="advisorSidebarSlot"></div>
</div>
